# On-demand end-to-end check of the PUBLISHED Windows installer (HV-297):
# runs packaging/install.ps1 against a real release and asserts the install is
# healthy (binary on disk, doctor ok, update path recognised). Dispatch-only —
# it needs a release that carries the Windows asset (v0.1.6+), so it cannot run
# on ordinary pushes. Note the runner is NOT a clean machine (large
# preinstalled toolchain); a throwaway VM is still the honest clean-box check.
name: install-check

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to install (blank = latest)"
        required: false
        default: ""
      update_from:
        description: "Older tag to install FIRST, then self update to latest (full download-then-swap composition; needs a newer Windows-bearing release to exist)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install from the published release and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $verifyArgs = @{ Installer = 'packaging\install.ps1' }
          if ('${{ inputs.version }}') { $verifyArgs.Version = '${{ inputs.version }}' }
          if ('${{ inputs.update_from }}') { $verifyArgs.UpdateFrom = '${{ inputs.update_from }}' }
          & packaging\verify-install.ps1 @verifyArgs

  # Windows-on-ARM must be REFUSED with a clear message, not handed a broken
  # download: PowerShell there is a native ARM64 process, so the installer's
  # arch gate takes the real user-visible path. windows-11-arm runners are
  # free for public repos.
  windows-arm-refusal:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Installer must refuse ARM64 loudly
        shell: pwsh
        run: |
          # Run the installer entirely inside cmd, capturing output and exit
          # code to FILES, with cmd always exiting 0 — the actions pwsh shell
          # (ErrorActionPreference=Stop) otherwise turns the child's stderr or
          # nonzero exit into a step-killing error before the assertions run.
          cmd /v:on /c 'pwsh -NoProfile -ExecutionPolicy Bypass -File packaging\install.ps1 > install-out.txt 2>&1 & echo !ERRORLEVEL! > install-code.txt'
          $out = Get-Content install-out.txt -Raw
          $code = [int](Get-Content install-code.txt -Raw).Trim()
          Write-Host "installer exit code: $code"
          Write-Host $out
          if ($code -eq 0) { throw 'installer should have refused on ARM64' }
          if ($out -notmatch 'ARM') { throw 'expected the ARM64-unsupported message' }
